spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/minecraft_panel
    username: panel
    password: ${DB_PASSWORD:panel_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

docker:
  host: ${DOCKER_HOST:unix:///var/run/docker.sock}
  servers:
    base-path: ${DOCKER_SERVERS_PATH:/tmp/panel/servers}

panel:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-real-secret-in-production-at-least-256-bits-long}
    access-token-expiry: 900       # 15 minutes
    refresh-token-expiry: 604800   # 7 days
  rcon:
    connection-timeout: 5000
  backup:
    base-path: ${BACKUP_PATH:/tmp/panel/backups}

server:
  port: 8080

logging:
  level:
    com.panel: INFO
    org.springframework.web.socket: DEBUG
